# Pull requests are squash-merged, so the PR title becomes the commit that
# lands on main and the commit that release-please reads to decide the next
# version. This check keeps those titles in Conventional Commits form.
#
#   feat: ...      -> minor bump (0.x.0)
#   fix: ...       -> patch bump (0.x.y)
#   feat!: ...     -> minor bump too, while the project is pre-1.0
#   docs/test/chore/refactor/perf/ci/build: no release on their own
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            chore
            ci
            build
          requireScope: false
          # The subject after "type: " must not start with an uppercase letter,
          # matching the style of the existing history.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase letter,
            like the rest of the history: "fix: stop keywords matching inside identifiers".
